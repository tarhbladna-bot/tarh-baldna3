<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home - Tarh bladna</title>
    
    <link rel="canonical" href="https://yhagciqxo3.trywebops.co/">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Home - Tarh bladna">
    <meta property="og:url" content="https://yhagciqxo3.trywebops.co/">
    
    <style>
        /* التنسيقات الأساسية المتوافقة مع Astra Theme */
        :root {
            --ast-global-color-0: #046BD2;
            --ast-global-color-1: #045cb5;
            --ast-global-color-2: #111827;
            --ast-global-color-3: #4b5563;
            --ast-global-color-4: #f3f4f6;
            --ast-form-input-text: #475569;
        }

        body {
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 16px;
            line-height: 1.75;
            margin: 0;
            background-color: var(--ast-global-color-4);
            color: var(--ast-global-color-3);
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'EB Garamond', serif;
            font-weight: 600;
            color: var(--ast-global-color-2);
            line-height: 1.2;
        }

        /* تصحيح الجزء المقطوع من الكود السابق */
        @media (max-width: 544px) {
            h1, .entry-content h1 { font-size: 36px; }
            h2, .entry-content h2 { font-size: 30px; }
            .site-title { display: block; font-size: 1.2rem; }
        }

        .ast-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .ast-button, button, input[type="submit"] {
            border-radius: 6px;
            padding: 14px 28px;
            background-color: var(--ast-global-color-0);
            color: #ffffff;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .ast-button:hover {
            background-color: var(--ast-global-color-1);
        }

        input[type="text"], input[type="email"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        /* Header Style */
        header {
            background: #fff;
            padding: 15px 0;
            border-bottom: 1px solid #eaeaea;
        }

        .site-identity {
            display: flex;
            align-items: center;
            gap: 15px;
        }
    </style>
</head>
<body>

    <header>
        <div class="ast-container">
            <div class="site-identity">
                <h1 class="site-title"><a href="#">Tarh bladna</a></h1>
            </div>
        </div>
    </header>

    <main id="content" class="site-content">
        <div class="ast-container">
            <article class="ast-article-single">
                <header class="entry-header">
                    <h1 class="entry-title">مرحباً بكم في موقعنا</h1>
                </header>

                <div class="entry-content">
                    <p>هذا النص تجريبي لعرض المحتوى بعد تصحيح أخطاء الأكواد المقطوعة. يمكنك الآن إضافة محتواك هنا.</p>
                    <button class="ast-button">اقرأ المزيد</button>
                </div>
            </article>
        </div>
    </main>

    <footer style="text-align: center; padding: 20px; background: #fff; margin-top: 40px;">
        <p>© 2026 Tarh bladna - جميع الحقوق محفوظة</p>
    </footer>

</body>
</html>
