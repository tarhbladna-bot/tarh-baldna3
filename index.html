<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>شركة طرح بلدنا للمحاصيل الزراعية | أبو يوسف لتجارة الفول السوداني والمفروك</title>
  <meta name="description" content="تصنيع وتجهيز وتوريد وتصدير الفول السوداني بجميع أنواعه. توريد لجميع محافظات مصر وتصدير لأي مكان في العالم. السعر عند الطلب." />

  <!-- SEO / Social -->
  <meta property="og:title" content="شركة طرح بلدنا للمحاصيل الزراعية" />
  <meta property="og:description" content="توريد محلي لجميع محافظات مصر + تصدير عالمي. شكاير 50/25 كجم وعبوات فاكيوم 10 كجم." />
  <meta property="og:image" content="banner.png" />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#050508" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    :root{
      --bg:#050508;
      --bg2:#07070a;
      --surface: rgba(255,255,255,.06);
      --surface2: rgba(255,255,255,.09);
      --border: rgba(255,255,255,.12);
      --text:#f3f4f6;
      --muted: rgba(243,244,246,.72);
      --red:#e11d48;
      --red2:#ff2d55;
      --shadow: 0 18px 48px rgba(0,0,0,.55);
      --shadow2: 0 26px 70px rgba(0,0,0,.62);
      --radius: 18px;
      --ring: rgba(225,29,72,.38);
    }

    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
    body{
      font-family:"Cairo","Inter",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      overflow-x:hidden;
    }
    a{color:inherit}
    .wrap{max-width:1180px;margin:0 auto;padding:0 16px}
    .sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

    /* Topbar */
    .topbar{
      position:sticky;top:0;z-index:50;
      background: rgba(5,5,8,.72);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .topbarIn{
      display:flex;align-items:center;justify-content:space-between;
      padding:12px 0;gap:12px;
    }
    .brand{display:flex;align-items:center;gap:12px;min-width:260px}
    .logo{
      width:44px;height:44px;border-radius:14px;
      border:1px solid rgba(225,29,72,.45);
      background: radial-gradient(22px 22px at 30% 30%, rgba(255,45,85,.40), transparent 72%),
                  linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
      box-shadow: 0 14px 36px rgba(225,29,72,.14);
      position:relative;overflow:hidden;
    }
    .logo:after{
      content:""; position:absolute; inset:-2px;
      background: radial-gradient(260px 90px at 50% 0%, rgba(225,29,72,.22), transparent 60%);
      opacity:.95;
    }
    .brandName{font-weight:950;letter-spacing:.2px;line-height:1.15}
    .brandSub{color:var(--muted);font-weight:800;font-size:13px;margin-top:2px}

    .actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
    .pill{
      display:inline-flex;align-items:center;gap:10px;
      padding:10px 12px;border-radius:999px;text-decoration:none;
      border:1px solid var(--border);
      background: rgba(255,255,255,.04);
      font-weight:900;
      transition: transform .2s ease, border-color .2s ease, background .2s ease, box-shadow .2s ease;
    }
    .pill:hover{transform: translateY(-1px);border-color: var(--ring);background: rgba(255,255,255,.06)}
    .pillRed{
      background: linear-gradient(90deg, var(--red), var(--red2));
      border-color: rgba(225,29,72,.45);
      box-shadow: 0 18px 40px rgba(225,29,72,.18);
    }
    .pillRed:hover{box-shadow: 0 26px 60px rgba(225,29,72,.24)}
    .lang{
      display:inline-flex;gap:6px;padding:6px;border-radius:999px;
      border:1px solid rgba(255,255,255,.10);background: rgba(255,255,255,.03);
    }
    .lang button{
      border:0;cursor:pointer;
      padding:8px 10px;border-radius:999px;
      background:transparent;color:var(--text);
      font-weight:950;letter-spacing:.2px;
      transition: background .2s ease, transform .2s ease, border-color .2s ease;
    }
    .lang button.active{
      background: rgba(225,29,72,.18);
      border:1px solid rgba(225,29,72,.35);
    }

    /* Hero */
    .hero{
      background:
        radial-gradient(900px 360px at 20% 0%, rgba(225,29,72,.18), transparent 60%),
        radial-gradient(700px 280px at 80% 20%, rgba(255,45,85,.10), transparent 55%),
        linear-gradient(180deg, #050508, var(--bg2));
      padding: 18px 0 50px;
      position:relative;
      overflow:hidden;
    }

    .heroBanner{
      margin: 14px auto 0;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.10);
      overflow:hidden;
      box-shadow: var(--shadow2);
      position:relative;
      max-width:1180px;
    }
    .heroBanner img{width:100%;display:block;max-height:420px;object-fit:cover}
    .heroBanner:after{
      content:"";
      position:absolute;inset:0;
      background: linear-gradient(180deg, rgba(5,5,8,.10), rgba(5,5,8,.55));
      pointer-events:none;
    }

    .heroGrid{
      display:grid;
      grid-template-columns: 1.25fr .75fr;
      gap:18px;
      align-items:stretch;
      margin-top:18px;
    }
    .kicker{
      display:inline-flex;align-items:center;gap:10px;
      padding:8px 12px;border-radius:999px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.03);
      color: var(--muted);
      font-weight:900;
      width:fit-content;
    }
    .title{
      margin: 14px 0 10px;
      font-size: clamp(24px, 3.6vw, 44px);
      line-height: 1.18;
      font-weight: 980;
      letter-spacing: .2px;
    }
    .accent{
      position:relative;
      padding:0 .15em;
      color: var(--text);
    }
    .accent:after{
      content:"";position:absolute;left:0;right:0;bottom:.08em;height:.30em;
      background: linear-gradient(90deg, rgba(225,29,72,.0), rgba(225,29,72,.78), rgba(225,29,72,.0));
      border-radius:999px;z-index:-1;
    }
    .lead{
      color: var(--muted);
      font-size: 16px;line-height:1.9;margin:0;
      max-width: 820px;
      font-weight:700;
    }
    .ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
    .btn{
      display:inline-flex;align-items:center;gap:10px;
      padding:12px 16px;border-radius:14px;
      text-decoration:none;font-weight:980;letter-spacing:.2px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.04);
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }
    .btn:hover{transform: translateY(-2px);border-color: var(--ring);background: rgba(255,255,255,.06)}
    .btnPrimary{
      background: linear-gradient(90deg, var(--red), var(--red2));
      border-color: rgba(225,29,72,.45);
      box-shadow: 0 18px 40px rgba(225,29,72,.20);
    }
    .btnPrimary:hover{box-shadow: 0 26px 60px rgba(225,29,72,.26)}
    .badges{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    .badge{
      display:inline-flex;align-items:center;gap:10px;
      padding:10px 12px;border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.03);
      color: var(--muted);
      font-weight:900;
    }

    .glass{
      border-radius: 20px;
      border: 1px solid rgba(225,29,72,.28);
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      box-shadow: var(--shadow);
      padding: 16px;
      position:relative;
      overflow:hidden;
    }
    .glass:before{
      content:"";position:absolute;inset:-2px;
      background: radial-gradient(420px 160px at 40% 0%, rgba(225,29,72,.20), transparent 60%);
      opacity:.9;pointer-events:none;
    }
    .glass h3{margin:0 0 8px;font-weight:980}
    .list{margin:0;padding:0;list-style:none;color:var(--muted);line-height:1.95;font-weight:800}
    .list li{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
    .list i{color:#fff;opacity:.9;margin-top:4px}

    /* Sections */
    .section{padding: 56px 0}
    .secHead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .secTitle{margin:0;font-size: clamp(20px, 2.8vw, 34px);font-weight:980}
    .secDesc{margin:6px 0 0;color:var(--muted);line-height:1.9;font-weight:750;max-width:760px}

    /* Why us (4 icons) */
    .grid4{
      display:grid;grid-template-columns: repeat(12, 1fr);
      gap:14px;margin-top:20px;
    }
    .card{
      grid-column: span 3;
      border-radius: var(--radius);
      border:1px solid rgba(225,29,72,.28);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.04));
      box-shadow: var(--shadow);
      padding: 18px 16px;
      position:relative;
      overflow:hidden;
      transition: transform .25s ease, border-color .25s ease, background .25s ease, box-shadow .25s ease;
    }
    .card:hover{
      transform: translateY(-6px);
      border-color: rgba(225,29,72,.55);
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.05));
      box-shadow: var(--shadow2)
    }
    .ico{
      width:44px;height:44px;border-radius:14px;
      display:grid;place-items:center;
      background: rgba(225,29,72,.12);
      border:1px solid rgba(225,29,72,.32);
      box-shadow: 0 10px 26px rgba(225,29,72,.12);
      margin-bottom:10px;
    }
    .ico i{font-size:18px;color:#fff;text-shadow: 0 0 18px rgba(255,45,85,.35)}
    .card h4{margin:6px 0 6px;font-size:18px;font-weight:980}
    .card p{margin:0;color:var(--muted);line-height:1.9;font-weight:750;font-size:14.5px}

    /* Products */
    .productsGrid{
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap:14px;
      margin-top: 20px;
    }
    .prod{
      grid-column: span 4;
      border-radius: 20px;
      border: 1px solid rgba(225,29,72,.38); /* red border */
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.04));
      box-shadow: var(--shadow);
      overflow:hidden;
      position:relative;
      transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    }
    .prod:hover{
      transform: translateY(-6px);
      border-color: rgba(225,29,72,.62);
      box-shadow: var(--shadow2)
    }
    .prodTop{padding:16px 16px 10px}
    .prodTitle{margin:0;font-size:18px;font-weight:980}
    .prodSub{margin:6px 0 0;color:var(--muted);font-weight:850;line-height:1.7;font-size:14px}
    .price{
      display:inline-flex;align-items:center;gap:8px;margin-top:10px;
      padding:8px 10px;border-radius:999px;border:1px solid rgba(225,29,72,.22);
      background: rgba(255,255,255,.03);color:var(--muted);font-weight:950;font-size:13px;
    }
    .gallery{
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      gap:8px;
      padding: 0 16px 16px;
    }
    .shot{
      border-radius: 14px;
      overflow:hidden;
      border:1px solid rgba(225,29,72,.25);
      background: rgba(0,0,0,.25);
      aspect-ratio: 4/3;
      cursor:pointer;
      position:relative;
    }
    .shot:after{
      content:"";position:absolute;inset:0;
      background: radial-gradient(240px 120px at 50% 0%, rgba(225,29,72,.18), transparent 55%);
      opacity:.9;pointer-events:none;
    }
    .shot img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1);transition:transform .25s ease}
    .shot:hover img{transform:scale(1.04)}

    /* Testimonials */
    .testGrid{
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap:14px;
      margin-top:20px;
    }
    .tCard{
      grid-column: span 4;
      border-radius: 20px;
      border:1px solid rgba(225,29,72,.28);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.04));
      box-shadow: var(--shadow);
      padding: 16px;
      transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    }
    .tCard:hover{transform: translateY(-6px);border-color: rgba(225,29,72,.55);box-shadow: var(--shadow2)}
    .tHead{display:flex;align-items:center;gap:12px}
    .avatar{
      width:44px;height:44px;border-radius:16px;
      border:1px solid rgba(225,29,72,.35);
      background: linear-gradient(135deg, rgba(225,29,72,.30), rgba(255,45,85,.10));
      display:grid;place-items:center;
      font-weight:980;
      color:#fff;
      box-shadow: 0 14px 34px rgba(225,29,72,.12);
      flex:0 0 auto;
    }
    .tName{font-weight:980}
    .tMeta{color:var(--muted);font-weight:850;font-size:13px;margin-top:2px}
    .tText{margin:12px 0 0;color:rgba(243,244,246,.80);line-height:1.95;font-weight:750}
    .stars{margin-top:10px;color:#fff;opacity:.92}
    .stars i{margin-inline:1px}

    /* Contact */
    .contactBox{
      margin-top: 22px;
      display:grid;grid-template-columns: 1fr 1fr;gap:14px;
    }
    .contactCard{
      border-radius: 20px;
      border:1px solid rgba(225,29,72,.22);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.04));
      box-shadow: var(--shadow);
      padding: 16px;
    }
    .contactRow{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:900;line-height:1.9;margin:10px 0}
    .contactRow i{color:#fff;opacity:.95}
    .socials{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .soc{
      display:inline-flex;align-items:center;gap:10px;
      padding:10px 12px;border-radius:14px;text-decoration:none;
      border:1px solid rgba(225,29,72,.22);
      background: rgba(255,255,255,.04);
      font-weight:980;
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }
    .soc:hover{transform: translateY(-2px);border-color: rgba(225,29,72,.55);background: rgba(255,255,255,.06)}

    /* FAQ */
    .faq{
      margin-top:20px;
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap:14px;
    }
    details{
      grid-column: span 6;
      border-radius: 18px;
      border:1px solid rgba(225,29,72,.22);
      background: rgba(255,255,255,.04);
      box-shadow: var(--shadow);
      padding: 14px 14px;
    }
    summary{
      cursor:pointer;
      list-style:none;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      font-weight:980;
    }
    summary::-webkit-details-marker{display:none}
    details p{margin:10px 0 0;color:var(--muted);line-height:1.9;font-weight:800}

    /* Floating buttons */
    .float{
      position:fixed;
      right:16px;
      bottom:16px;
      display:flex;
      flex-direction:column;
      gap:10px;
      z-index:80;
    }
    .fab{
      width:52px;height:52px;border-radius:16px;
      display:grid;place-items:center;
      border:1px solid rgba(225,29,72,.22);
      background: rgba(255,255,255,.06);
      box-shadow: var(--shadow);
      text-decoration:none;
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }
    .fab:hover{transform: translateY(-2px);border-color: rgba(225,29,72,.55);background: rgba(255,255,255,.08)}
    .fab.red{
      background: linear-gradient(135deg, var(--red), var(--red2));
      border-color: rgba(225,29,72,.45);
    }
    .fab i{font-size:18px;color:#fff}
    .toTop{display:none}
    .toTop.show{display:grid}

    /* Lightbox */
    .lb{
      position:fixed;inset:0;
      background: rgba(0,0,0,.72);
      backdrop-filter: blur(10px);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:200;
      padding:16px;
    }
    .lb.show{display:flex}
    .lbBox{
      width:min(980px, 100%);
      border-radius: 22px;
      overflow:hidden;
      border:1px solid rgba(225,29,72,.35);
      background: rgba(10,10,14,.80);
      box-shadow: var(--shadow2);
      position:relative;
    }
    .lbImg{width:100%;height:auto;display:block;max-height:80vh;object-fit:contain;background:#000}
    .lbBar{
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:10px 12px;
      border-top:1px solid rgba(255,255,255,.08);
      color:rgba(243,244,246,.85);
      font-weight:900;
    }
    .lbBtn{
      border:1px solid rgba(225,29,72,.30);
      background: rgba(255,255,255,.04);
      color:#fff;
      border-radius: 14px;
      padding:10px 12px;
      cursor:pointer;
      font-weight:980;
      display:inline-flex;align-items:center;gap:10px;
    }
    .lbBtn:hover{border-color: rgba(225,29,72,.60)}
    .lbClose{
      position:absolute;top:10px;left:10px;
      width:44px;height:44px;border-radius:14px;
      display:grid;place-items:center;
      border:1px solid rgba(225,29,72,.30);
      background: rgba(0,0,0,.45);
      cursor:pointer;
      color:#fff;
    }
    .lbClose:hover{border-color: rgba(225,29,72,.60)}

    /* Footer */
    footer{
      border-top:1px solid rgba(255,255,255,.08);
      padding: 18px 0;
      color: var(--muted);
      font-weight:900;
      background: rgba(255,255,255,.02);
    }
    .footRow{
      display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center
    }
    .counter{
      display:inline-flex;align-items:center;gap:10px;
      padding:10px 12px;border-radius:999px;
      border:1px solid rgba(225,29,72,.22);
      background: rgba(255,255,255,.03);
      color: rgba(243,244,246,.75);
      font-weight:950;
    }

    /* Responsive */
    @media (max-width: 1024px){
      .heroGrid{grid-template-columns: 1fr}
      .card{grid-column: span 6}
      .prod{grid-column: span 6}
      .tCard{grid-column: span 6}
      details{grid-column: span 12}
      .contactBox{grid-template-columns: 1fr}
    }
    @media (max-width: 620px){
      .actions{justify-content:flex-start}
      .brand{min-width:auto}
      .card{grid-column: span 12}
      .prod{grid-column: span 12}
      .tCard{grid-column: span 12}
    }
    @media (prefers-reduced-motion: reduce){
      .card,.prod,.btn,.pill,.soc,.fab,.shot img,.tCard{transition:none}
      .card:hover,.prod:hover,.btn:hover,.pill:hover,.soc:hover,.fab:hover,.tCard:hover{transform:none}
      .shot:hover img{transform:none}
    }
  </style>
</head>

<body>
  <script>
    // =============================
    // CONFIG (عدّل لو تحب)
    // =============================
    const COMPANY = {
      name_ar: "شركة طرح بلدنا للمحاصيل الزراعية",
      sub_ar:  "أبو يوسف لتجارة الفول السوداني والمفروك",
      name_en: "Tarh Bledna Agricultural Crops Company",
      sub_en:  "Abu Youssef – Peanuts & Crushed Peanuts Trading",
      name_tr: "Tarh Bledna Tarımsal Ürünler Şirketi",
      sub_tr:  "Abu Youssef – Yer Fıstığı ve Kırık Fıstık Ticareti",
      phone1: "01126773698",
      phone2: "01020508423",
      email: "tarhbladna@gmail.com",
      address_ar: "أبورواش – الجيزة – مصر",
      address_en: "Abu Rawash – Giza – Egypt",
      address_tr: "Abu Rawash – Giza – Mısır",
      whatsapp: "201126773698" // بدون +
    };

    // صورك محليًا داخل الريبو (أفضل حل):
    const ASSET_BASE = "";          // سيبها فاضية لو الصور داخل نفس الريبو
    const HERO_BANNER_URL = ASSET_BASE + "banner.png";

    // Facebook page (من نتائج البحث ظهر لينك tarhbladna/about) :contentReference[oaicite:0]{index=0}
    // لو عندك لينك ماسنجر مباشر استخدمه، وإلا هنفتح صفحة الفيس.
    const FACEBOOK_PAGE_URL = "https://www.facebook.com/tarhbladna/about/";
    const MESSENGER_URL = "https://m.me/tarhbladna"; // إن لم يعمل، سيحوّل تلقائيًا لصفحة الفيس

    // 6 منتجات - الصور تتكوّن تلقائيًا (products/p1/1.jpg ... إلخ)
    const PRODUCT_KEYS = ["p1","p2","p3","p4","p5","p6"];
    const PRODUCT_IMAGES = Object.fromEntries(
      PRODUCT_KEYS.map(p => [p, [1,2,3,4].map(i => `${ASSET_BASE}products/${p}/${i}.jpg`)])
    );

    // =============================
    // i18n (AR/EN/TR)
    // =============================
    const I18N = {
      ar: {
        brandName: COMPANY.name_ar,
        brandSub: COMPANY.sub_ar,
        sales: "المبيعات",

  <section class="section" id="reviews">

  <!-- FAQ -->

  <!-- CONTACT -->
  <section class="section" id="contact">
    <div class="wrap">

      <div class="contactBox">
        <div class="contactCard">
          <div class="contactRow"><i class="fa-solid fa-building"></i><span data-i18n="brandName"></span></div>
          <div class="contactRow"><i class="fa-solid fa-user-tie"></i><span data-i18n="brandSub"></span></div>

          <div class="contactRow"><i class="fa-solid fa-phone"></i><span data-i18n="sales"></span>: <a id="tel1b" href="#"></a></div>
          <div class="contactRow"><i class="fa-solid fa-phone"></i><span data-i18n="contactPhone2"></span>: <a id="tel2b" href="#"></a></div>
          <div class="contactRow"><i class="fa-solid fa-envelope"></i><span data-i18n="email"></span>: <a id="mailb" href="#"></a></div>

          <div class="contactRow"><i class="fa-solid fa-location-dot"></i><span data-i18n="location"></span></div>
          <div class="contactRow"><i class="fa-solid fa-circle-info"></i><span data-i18n="priceNote"></span></div>

          <div class="socials">
            <a class="soc" id="waContact" href="#" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
            <a class="soc" id="fbContact" href="#" target="_blank" rel="noopener"><i class="fa-brands fa-facebook"></i> Facebook</a>
            <a class="soc" id="igContact" href="#" target="_blank" rel="noopener"><i class="fa-brands fa-instagram"></i> Instagram</a>

  <!-- Floating Buttons -->
  <div class="float" aria-label="Floating actions">
    <a class="fab red" id="waFab" href="#" target="_blank" rel="noopener" title="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
    <a class="fab" id="callFab" href="#" title="Call"><i class="fa-solid fa-phone"></i></a>

  <!-- Lightbox -->
  <div class="lb" id="lightbox" aria-hidden="true">
    <div class="lbBox" role="dialog" aria-modal="true" aria-label="Image viewer">
      <button class="lbClose" id="lbClose" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
      <img class="lbImg" id="lbImg" alt="Preview" />
      <div class="lbBar">
        <div id="lbTitle" style="opacity:.9"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="lbBtn" id="lbPrev"><i class="fa-solid fa-chevron-left"></i><span>Prev</span></button>
          <button class="lbBtn" id="lbNext"><span>Next</span><i class="fa-solid fa-chevron-right"></i></button>
        </div>

    </div>

  <footer>
    <div class="wrap">
      <div class="footRow">
        <div>© <span id="year"></span> <span data-i18n="brandName"></span></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          <div><span data-i18n="footerNote"></span></div>
          <div class="counter"><i class="fa-solid fa-chart-simple"></i><span data-i18n="visits"></span>: <span id="visitCount">—</span></div>
        </div>
      </div>
    </div>
  </footer>

  <script>
    // -----------------------------
    // Helpers
    // -----------------------------
    function telHref(num){ return "tel:" + (num || "").trim(); }
    function waHref(num){ return "https://wa.me/" + (num || "").trim(); }
    function mailHref(em){ return "mailto:" + (em || "").trim(); }

    // -----------------------------
    // Init static data
    // -----------------------------
    document.getElementById("year").textContent = new Date().getFullYear();

    // Banner
    const heroImg = document.getElementById("heroBannerImg");
    heroImg.src = HERO_BANNER_URL;
    heroImg.loading = "eager";

    // Phones / links
    const phone1Txt = document.getElementById("phone1Txt");
    phone1Txt.textContent = COMPANY.phone1;

    const tel1 = document.getElementById("tel1");
    const callHero = document.getElementById("callHero");
    const callService = document.getElementById("callService");
    const callFab = document.getElementById("callFab");
    [tel1, callHero, callService, callFab].forEach(a=> a.href = telHref(COMPANY.phone1));

    document.getElementById("tel1b").textContent = COMPANY.phone1;
    document.getElementById("tel1b").href = telHref(COMPANY.phone1);

    document.getElementById("tel2b").textContent = COMPANY.phone2;
    document.getElementById("tel2b").href = telHref(COMPANY.phone2);

    document.getElementById("mailb").textContent = COMPANY.email;
    document.getElementById("mailb").href = mailHref(COMPANY.email);

    const waLinks = ["waTop","waHero","waService","waFab","waContact"];
    waLinks.forEach(id=> document.getElementById(id).href = waHref(COMPANY.whatsapp));

    // Social
    document.getElementById("fbContact").href = SOCIAL.facebook || FACEBOOK_PAGE_URL;
    document.getElementById("igContact").href = SOCIAL.instagram;
    document.getElementById("msContact").href = MESSENGER_URL || FACEBOOK_PAGE_URL;
    document.getElementById("msFab").href = MESSENGER_URL || FACEBOOK_PAGE_URL;

    // -----------------------------
    // Fill product images + click to open lightbox
    // -----------------------------
    function fillProductImages(){
      document.querySelectorAll(".prod").forEach(card=>{
        const key = card.getAttribute("data-product");
        const imgs = (PRODUCT_IMAGES[key] || []);
        const nodes = card.querySelectorAll(".gallery img");
        nodes.forEach((imgEl, idx)=>{
          const url = imgs[idx] || "";
          imgEl.src = url;
          imgEl.loading = "lazy";
          imgEl.decoding = "async";
        });

        // set click handlers on .shot
        const shots = card.querySelectorAll(".shot");
        shots.forEach((shot, idx)=>{
          shot.addEventListener("click", ()=> openLightbox(key, idx));
          shot.addEventListener("keydown", (e)=>{
            if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openLightbox(key, idx); }
          });
        });
      });
    }

    // -----------------------------
    // Lightbox logic
    // -----------------------------
    const lb = document.getElementById("lightbox");
    const lbImg = document.getElementById("lbImg");
    const lbTitle = document.getElementById("lbTitle");
    const lbClose = document.getElementById("lbClose");
    const lbPrev = document.getElementById("lbPrev");
    const lbNext = document.getElementById("lbNext");

    let lbKey = "p1";
    let lbIdx = 0;

    function openLightbox(key, idx){
      lbKey = key;
      lbIdx = idx;
      const imgs = PRODUCT_IMAGES[lbKey] || [];
      lbImg.src = imgs[lbIdx] || "";
      lbTitle.textContent = `${key.toUpperCase()} • ${lbIdx+1}/4`;
      lb.classList.add("show");
      lb.setAttribute("aria-hidden","false");
      document.body.style.overflow = "hidden";
    }
    function closeLightbox(){
      lb.classList.remove("show");
      lb.setAttribute("aria-hidden","true");
      document.body.style.overflow = "";
      lbImg.src = "";
    }
    function step(dir){
      const imgs = PRODUCT_IMAGES[lbKey] || [];
      const max = imgs.length || 4;
      lbIdx = (lbIdx + dir + max) % max;
      lbImg.src = imgs[lbIdx] || "";
      lbTitle.textContent = `${lbKey.toUpperCase()} • ${lbIdx+1}/4`;
    }

    lbClose.addEventListener("click", closeLightbox);
    lb.addEventListener("click", (e)=>{ if(e.target === lb) closeLightbox(); });
    lbPrev.addEventListener("click", ()=> step(-1));
    lbNext.addEventListener("click", ()=> step(+1));
    window.addEventListener("keydown", (e)=>{
      if(!lb.classList.contains("show")) return;
      if(e.key === "Escape") closeLightbox();
      if(e.key === "ArrowLeft") step(-1);
      if(e.key === "ArrowRight") step(+1);
    });

    // -----------------------------
    // Testimonials (avatars = initials)
    // -----------------------------
    function makeAvatar(name){
      const parts = (name || "").trim().split(" ").filter(Boolean);
      const a = parts[0]?.[0] || "★";
      const b = parts[1]?.[0] || "";
      return (a + b).toUpperCase();
    }

    function renderReviews(lang){
      const d = I18N[lang] || I18N.ar;
      const items = [
        { n:d.r1n, m:d.r1m, t:d.r1t },
        { n:d.r2n, m:d.r2m, t:d.r2t },
        { n:d.r3n, m:d.r3m, t:d.r3t },
        { n:d.r4n, m:d.r4m, t:d.r4t },
        { n:d.r5n, m:d.r5m, t:d.r5t },
        { n:d.r6n, m:d.r6m, t:d.r6t },
      ];
      const grid = document.getElementById("reviewsGrid");
      grid.innerHTML = items.map(x=>`
        <article class="tCard">
          <div class="tHead">
            <div class="avatar">${makeAvatar(x.n)}</div>
            <div>
              <div class="tName">${x.n}</div>
              <div class="tMeta">${x.m}</div>
            </div>
          </div>
          <div class="tText">${x.t}</div>
          <div class="stars" aria-label="5 stars">
            <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i>
          </div>
        </article>
      `).join("");
    }

    // -----------------------------
    // Language switch
    // -----------------------------
    let currentLang = "ar";

    function applyLang(lang){
      currentLang = lang;
      const isRTL = (lang === "ar");
      document.documentElement.lang = lang;
      document.documentElement.dir = isRTL ? "rtl" : "ltr";
      document.body.style.fontFamily = isRTL
        ? '"Cairo","Inter",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif'
        : '"Inter","Cairo",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif';

      const dict = I18N[lang] || I18N.ar;
      document.querySelectorAll("[data-i18n]").forEach(el=>{
        const key = el.getAttribute("data-i18n");
        if (dict[key]) el.textContent = dict[key];
      });

      // Buttons state
      document.querySelectorAll(".lang button").forEach(b=>{
        b.classList.toggle("active", b.getAttribute("data-lang") === lang);
      });

      // Update reviews
      renderReviews(lang);
    }

    document.querySelectorAll(".lang button").forEach(btn=>{
      btn.addEventListener("click", ()=> applyLang(btn.getAttribute("data-lang")));
    });

    // -----------------------------
    // Visitor Counter (على نفس الجهاز)
    // -----------------------------
    function updateCounter(){
      const key = "tarh_bledna_visits_total";
      let total = Number(localStorage.getItem(key) || "0");
      // زيادة مرة لكل فتح صفحة (session)
      const sessKey = "tarh_bledna_visited_session";
      if(!sessionStorage.getItem(sessKey)){
        total += 1;
        localStorage.setItem(key, String(total));
        sessionStorage.setItem(sessKey, "1");
      }
      document.getElementById("visitCount").textContent = total.toLocaleString();
    }

    // -----------------------------
    // ToTop button
    // -----------------------------
    const toTop = document.getElementById("toTop");
    window.addEventListener("scroll", ()=>{
      if (window.scrollY > 700) toTop.classList.add("show");
      else toTop.classList.remove("show");
    });

    // Init
    fillProductImages();
    applyLang("ar");
    updateCounter();
  </script>
</body>
